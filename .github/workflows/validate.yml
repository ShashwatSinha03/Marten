name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@9.15.0
          pnpm install --frozen-lockfile
      - name: Install fixture browser
        run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Verify sandboxed Chromium starts
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          // Credential-free launch only: preserve startup diagnostics that the
          // application deliberately replaces with safe public error messages.
          const browser = await chromium.launch({ headless: true, chromiumSandbox: true });
          try {
            const page = await browser.newPage();
            await page.goto('about:blank');
            console.log('Sandboxed Chromium startup passed.');
          } finally {
            await browser.close();
          }
          NODE
      - name: Backend and shared contracts
        run: pnpm typecheck
      - name: Fixture and API tests
        run: node --import tsx --test --test-concurrency=1 apps/api/test/*.test.ts
      - name: Frontend typecheck
        run: pnpm web:typecheck
      - name: Frontend request boundary tests
        run: node --import tsx --test apps/web/lib/request.test.ts
      - name: Frontend production build
        run: pnpm web:build
      - name: Backend container build
        run: docker build --tag marten-api:validation .
